[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cart-surrogate-analysis"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
  "joblib>=1.3"
]

[project.scripts]
cart-study = "cart_pipeline.cli:main"
cart-build-solver = "cart_pipeline.build_solver:main"
cart-replot = "cart_pipeline.replot:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cart_pipeline = ["cpp/*.cpp", "cpp/CMakeLists.txt"]
